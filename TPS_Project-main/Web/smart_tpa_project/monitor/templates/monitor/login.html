<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart TPS Monitor</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --color-primary: #4E944F;
            --color-secondary: #83BD75;
            --color-accent: #B4E197;
            --color-bg: #E9EFC0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--color-bg);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Dekorasi Background (Floating Shapes) */
        .shape {
            position: absolute;
            filter: blur(50px);
            z-index: -1;
            animation: float 10s infinite alternate;
        }
        .shape-1 {
            width: 300px; height: 300px;
            background: var(--color-accent);
            top: -50px; left: -50px;
            border-radius: 50%;
        }
        .shape-2 {
            width: 400px; height: 400px;
            background: var(--color-secondary);
            bottom: -100px; right: -100px;
            border-radius: 50%;
            animation-delay: 2s;
        }

        @keyframes float {
            0% { transform: translate(0, 0); }
            100% { transform: translate(30px, 50px); }
        }

        /* Card Login Style */
        .login-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(78, 148, 79, 0.2);
            padding: 40px;
            width: 100%;
            max-width: 400px;
            border-top: 5px solid var(--color-primary);
            transition: transform 0.3s;
        }

        .login-card:hover {
            transform: translateY(-5px);
        }

        .brand-title {
            color: var(--color-primary);
            font-weight: 700;
            margin-bottom: 5px;
        }

        .brand-subtitle {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 30px;
        }

        /* Custom Input */
        .form-floating > .form-control:focus ~ label,
        .form-floating > .form-control:not(:placeholder-shown) ~ label {
            color: var(--color-primary);
            transform: scale(.85) translateY(-.5rem) translateX(.15rem);
        }

        .form-control:focus {
            border-color: var(--color-secondary);
            box-shadow: 0 0 0 0.25rem rgba(131, 189, 117, 0.25);
        }

        /* Custom Button */
        .btn-custom {
            background-color: var(--color-primary);
            border: none;
            color: white;
            padding: 12px;
            font-weight: 600;
            border-radius: 10px;
            transition: all 0.3s;
        }

        .btn-custom:hover {
            background-color: var(--color-secondary);
            transform: scale(1.02);
        }

        .link-register {
            color: var(--color-primary);
            text-decoration: none;
            font-weight: 600;
        }
        .link-register:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>

    <div class="login-card">
        <div class="text-center">
            <h2 class="brand-title"><i class="fas fa-leaf"></i> Smart TPS</h2>
            <p class="brand-subtitle">Monitoring Lingkungan Cerdas</p>
        </div>

        <form id="loginForm">
            <div class="form-floating mb-3">
                <input type="text" class="form-control" id="username" placeholder="Username" required>
                <label for="username"><i class="fas fa-user me-2"></i>Username</label>
            </div>

            <div class="form-floating mb-4">
                <input type="password" class="form-control" id="password" placeholder="Password" required>
                <label for="password"><i class="fas fa-lock me-2"></i>Password</label>
            </div>

            <button type="submit" class="btn btn-custom w-100" id="btnLogin">
                <span id="btnText">Masuk Sekarang</span>
                <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
            </button>
        </form>

        <div class="text-center mt-4">
            <p class="small text-muted">Belum memiliki akun?</p>
            <a href="/register/" class="link-register">Daftar sebagai Warga</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // 1. Ambil Element
            const btn = document.getElementById('btnLogin');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            // 2. Set Loading State (Biar terlihat prosesnya)
            btn.disabled = true;
            btnText.textContent = "Memproses...";
            btnSpinner.classList.remove('d-none');

            try {
                // 3. Tembak API
                const response = await fetch('/api/auth/login/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username, password: password })
                });

                const data = await response.json();

                // 4. Simulasi delay dikit biar animasi loading kelihatan keren (opsional)
                await new Promise(r => setTimeout(r, 800));

                if (response.ok) {
                    // Sukses Login
                    localStorage.setItem('user_token', data.token);
                    
                    Swal.fire({
                        icon: 'success',
                        title: 'Login Berhasil!',
                        text: 'Mengalihkan ke Dashboard...',
                        showConfirmButton: false,
                        timer: 1500,
                        background: '#fff',
                        color: '#4E944F'
                    }).then(() => {
                        window.location.href = '/dashboard/';
                    });

                } else {
                    // Gagal Login
                    throw new Error("Username atau Password salah.");
                }

            } catch (error) {
                // Tampilkan Error Cantik
                Swal.fire({
                    icon: 'error',
                    title: 'Oops...',
                    text: 'Username atau Password salah!',
                    confirmButtonColor: '#4E944F'
                });
                
                // Reset Tombol
                btn.disabled = false;
                btnText.textContent = "Masuk Sekarang";
                btnSpinner.classList.add('d-none');
            }
        });
    </script>
</body>
</html>
