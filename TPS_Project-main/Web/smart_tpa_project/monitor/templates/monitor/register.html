<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Warga - Smart TPA</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --color-primary: #4E944F;
            --color-secondary: #83BD75;
            --color-accent: #B4E197;
            --color-bg: #E9EFC0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--color-bg);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Dekorasi Background (Floating Shapes) - Beda posisi dikit dari Login biar dinamis */
        .shape {
            position: absolute;
            filter: blur(60px);
            z-index: -1;
            animation: float 8s infinite alternate;
        }
        .shape-1 {
            width: 350px; height: 350px;
            background: var(--color-primary);
            top: -100px; right: -50px; /* Posisi beda */
            border-radius: 50%;
            opacity: 0.4;
        }
        .shape-2 {
            width: 300px; height: 300px;
            background: var(--color-accent);
            bottom: -50px; left: -50px; /* Posisi beda */
            border-radius: 50%;
            animation-delay: 1s;
        }

        @keyframes float {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-30px, -40px); }
        }

        /* Card Style */
        .register-card {
            background: rgba(255, 255, 255, 0.95); /* Sedikit lebih solid */
            backdrop-filter: blur(15px);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(78, 148, 79, 0.15);
            padding: 40px;
            width: 100%;
            max-width: 450px;
            border-bottom: 5px solid var(--color-secondary);
        }

        .header-title {
            color: var(--color-primary);
            font-weight: 700;
        }

        /* Input Styles */
        .form-floating > .form-control:focus ~ label,
        .form-floating > .form-control:not(:placeholder-shown) ~ label {
            color: var(--color-primary);
        }

        .form-control:focus {
            border-color: var(--color-secondary);
            box-shadow: 0 0 0 0.25rem rgba(131, 189, 117, 0.25);
        }

        /* Button */
        .btn-register {
            background: linear-gradient(45deg, var(--color-primary), var(--color-secondary));
            border: none;
            color: white;
            padding: 12px;
            font-weight: 600;
            border-radius: 10px;
            transition: all 0.3s;
        }

        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(78, 148, 79, 0.4);
        }

        .link-login {
            color: var(--color-primary);
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>

    <div class="register-card">
        <div class="text-center mb-4">
            <h2 class="header-title">Registrasi Warga</h2>
            <p class="text-muted small">Bergabung untuk lingkungan yang lebih sehat</p>
        </div>

        <form id="registerForm">
            <div class="form-floating mb-3">
                <input type="text" class="form-control" id="username" placeholder="Username" required>
                <label><i class="fas fa-user me-2"></i>Username</label>
            </div>

            <div class="form-floating mb-3">
                <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                <label><i class="fas fa-envelope me-2"></i>Email Address</label>
            </div>

            <div class="form-floating mb-4">
                <input type="password" class="form-control" id="password" placeholder="Password" required>
                <label><i class="fas fa-key me-2"></i>Password</label>
            </div>

            <button type="submit" class="btn btn-register w-100" id="btnReg">
                <span id="btnText">Daftar Sekarang</span>
                <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
            </button>
        </form>

        <div class="text-center mt-4">
            <p class="small text-muted">Sudah memiliki akun?</p>
            <a href="/" class="link-login"><i class="fas fa-sign-in-alt me-1"></i> Login disini</a>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('btnReg');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');

            // Set Loading
            btn.disabled = true;
            btnText.textContent = "Mendaftarkan...";
            btnSpinner.classList.remove('d-none');

            const payload = {
                username: document.getElementById('username').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                role: 'Warga' 
            };

            try {
                const response = await fetch('/api/auth/register/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                // Simulasi delay biar smooth
                await new Promise(r => setTimeout(r, 800));

                if (response.ok) {
                    Swal.fire({
                        icon: 'success',
                        title: 'Registrasi Berhasil!',
                        text: 'Silakan login dengan akun baru Anda.',
                        confirmButtonColor: '#4E944F',
                        confirmButtonText: 'Ke Halaman Login'
                    }).then((result) => {
                        window.location.href = '/';
                    });
                } else {
                    const data = await response.json();
                    
                    // Parsing pesan error dari server (misal: username taken)
                    let errorMsg = "Gagal melakukan registrasi.";
                    if (data.username) errorMsg = `Username: ${data.username[0]}`;
                    else if (data.email) errorMsg = `Email: ${data.email[0]}`;
                    
                    throw new Error(errorMsg);
                }

            } catch (error) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Gagal Daftar',
                    text: error.message,
                    confirmButtonColor: '#d33'
                });
                
                // Reset Button
                btn.disabled = false;
                btnText.textContent = "Daftar Sekarang";
                btnSpinner.classList.add('d-none');
            }
        });
    </script>
</body>
</html>
