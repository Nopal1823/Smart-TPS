<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Smart TPA</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --color-primary: #4E944F;
            --color-secondary: #83BD75;
            --color-accent: #B4E197;
            --color-bg: #E9EFC0;
            --color-text: #2c3e50;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--color-bg);
            min-height: 100vh;
            color: var(--color-text);
            position: relative;
            overflow-x: hidden;
        }

        /* Background Decoration */
        .bg-shape {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.6;
        }
        .shape-1 {
            width: 400px; height: 400px;
            background: var(--color-accent);
            top: -100px; left: -100px;
        }
        .shape-2 {
            width: 300px; height: 300px;
            background: var(--color-secondary);
            bottom: -50px; right: -50px;
        }

        /* Navbar */
        .navbar-custom {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(78, 148, 79, 0.1);
            padding: 15px 0;
        }
        .navbar-brand {
            font-weight: 700;
            color: var(--color-primary) !important;
            font-size: 1.5rem;
        }
        .nav-user {
            font-weight: 600;
            color: #555;
            text-align: right;
            line-height: 1.2;
        }

        /* Buttons */
        .btn-logout {
            border: 2px solid var(--color-primary);
            color: var(--color-primary);
            border-radius: 12px;
            padding: 8px 15px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-logout:hover {
            background: var(--color-primary);
            color: white;
        }

        .btn-add {
            background: var(--color-primary);
            color: white;
            border-radius: 50px;
            padding: 10px 25px;
            box-shadow: 0 4px 15px rgba(78, 148, 79, 0.4);
            border: none;
            transition: transform 0.2s;
        }
        .btn-add:hover {
            background: var(--color-secondary);
            transform: translateY(-2px);
            color: white;
        }

        /* --- STYLING TOMBOL INBOX & BUBBLE (BARU) --- */
        .btn-inbox {
            background: var(--color-primary);
            color: white;
            border: 1px solid var(--color-primary);
            border-radius: 12px;
            padding: 8px 20px;
            font-weight: 600;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            position: relative; /* Penting untuk posisi bubble */
        }
        .btn-inbox:hover {
            background: var(--color-secondary);
            border-color: var(--color-secondary);
            transform: translateY(-2px);
            color: white;
        }
        
        /* Bubble Merah Notifikasi */
        .badge-notification {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #ff4757;
            color: white;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            font-weight: bold;
        }

        /* Animasi Berdenyut (Sama kayak di inbox) */
        .badge-notification.pulse {
            animation: pulse-animation 2s infinite;
        }
        
        @keyframes pulse-animation {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 10px rgba(255, 71, 87, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 71, 87, 0); }
        }
        /* ------------------------------------------- */

        /* Spot Card */
        .spot-card {
            background: white;
            border-radius: 20px;
            border: none;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            cursor: pointer;
            height: 100%;
            position: relative;
        }
        .spot-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(78, 148, 79, 0.2);
        }
        .card-icon {
            font-size: 3rem;
            color: var(--color-secondary);
            opacity: 0.2;
            position: absolute;
            bottom: -10px;
            right: 10px;
        }
        .status-badge {
            font-size: 0.8rem;
            padding: 5px 12px;
            border-radius: 15px;
            font-weight: 600;
        }
        .status-aman { background: #d1e7dd; color: #0f5132; }
        .status-sedang { background: #fff3cd; color: #664d03; }
        .status-bahaya { background: #f8d7da; color: #842029; }

        .skeleton {
            background: #eee;
            background: linear-gradient(110deg, #ececec 8%, #f5f5f5 18%, #ececec 33%);
            border-radius: 5px;
            background-size: 200% 100%;
            animation: 1.5s shine linear infinite;
        }
        @keyframes shine {
            to { background-position-x: -200%; }
        }
    </style>
</head>
<body>

    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>

    <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
        <div class="container">
            <a class="navbar-brand" href="#"><i class="fas fa-leaf me-2"></i>Smart TPS</a>
            
            <div class="d-flex align-items-center">
                <div class="d-none d-md-block me-4">
                    <div id="welcomeName" class="nav-user">Memuat...</div>
                    <small id="welcomeRole" class="text-muted d-block text-end" style="font-size: 0.75rem;">...</small>
                </div>
                
                <div class="d-flex gap-2">
                    <a href="/inbox/" id="btnInbox" class="btn btn-inbox d-none text-decoration-none shadow-sm">
                        <i class="fas fa-inbox me-2"></i> Laporan
                        <span id="dashboardBadge" class="badge-notification d-none">0</span>
                    </a>
                    
                    <button onclick="confirmLogout()" class="btn btn-logout" title="Keluar Aplikasi">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row align-items-center mb-5">
            <div class="col-md-8">
                <h2 class="fw-bold" style="color: var(--color-primary);">Monitoring Kualitas Udara</h2>
                <p class="text-muted">Pantau kondisi sensor TPA secara realtime dan akurat.</p>
            </div>
            <div class="col-md-4 text-md-end">
                <button id="btnAddSpot" class="btn btn-add d-none" data-bs-toggle="modal" data-bs-target="#addSpotModal">
                    <i class="fas fa-plus-circle me-2"></i>Tambah Sensor
                </button>
            </div>
        </div>

        <div id="spotsContainer" class="row g-4">
            <div class="col-md-4"><div class="card border-0 p-4" style="border-radius:20px;"><div class="skeleton" style="height:200px;"></div></div></div>
            <div class="col-md-4"><div class="card border-0 p-4" style="border-radius:20px;"><div class="skeleton" style="height:200px;"></div></div></div>
            <div class="col-md-4"><div class="card border-0 p-4" style="border-radius:20px;"><div class="skeleton" style="height:200px;"></div></div></div>
        </div>
    </div>

    <div class="modal fade" id="addSpotModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg" style="border-radius: 20px;">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold text-primary">Tambah Sensor Baru</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="addSpotForm">
                        <div class="form-floating mb-3">
                            <select id="sensorId" class="form-select" required>
                                <option value="" selected disabled>Pilih ID Sensor...</option>
                                <option value="ESP32_01">ESP32_01 (Unit Alpha)</option>
                                <option value="ESP32_02">ESP32_02 (Unit Beta)</option>
                                <option value="ESP32_03">ESP32_03 (Unit Charlie)</option>
                                <option value="ESP32_04">ESP32_04 (Unit Delta)</option>
                                <option value="ESP32_05">ESP32_05 (Unit Echo)</option>
                            </select>
                            <label>Sensor ID (Pilih dari Stok)</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input type="text" id="namaLokasi" class="form-control" placeholder="Nama" required>
                            <label>Nama Lokasi TPA</label>
                        </div>
                        <div class="form-floating mb-4">
                            <textarea id="alamat" class="form-control" placeholder="Alamat" style="height: 100px"></textarea>
                            <label>Alamat Lengkap</label>
                        </div>
                        <button type="submit" class="btn btn-add w-100 py-3">Simpan Data</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const token = localStorage.getItem('user_token');
        let currentUserRole = '';

        if (!token) window.location.href = '/';

        async function initDashboard() {
            try {
                const profileResp = await fetch('/api/auth/profile/', {
                    headers: { 'Authorization': `Token ${token}` }
                });
                
                if (!profileResp.ok) throw new Error("Session Expired");
                
                const user = await profileResp.json();
                currentUserRole = user.role;

                document.getElementById('welcomeName').textContent = user.username;
                document.getElementById('welcomeRole').textContent = user.role;

                if (currentUserRole === 'Pemerintah') {
                    document.getElementById('btnAddSpot').classList.remove('d-none');
                    document.getElementById('btnInbox').classList.remove('d-none');
                    
                    // --- JALANKAN CHECKER BUBBLE DISINI ---
                    updateDashboardBadge(); // Cek pertama kali
                    setInterval(updateDashboardBadge, 10000); // Cek ulang tiap 10 detik
                }

                loadSpots();

            } catch (error) {
                confirmLogout("Sesi Anda telah berakhir.");
            }
        }

        // --- FUNGSI UPDATE BUBBLE BADGE (BARU) ---
        async function updateDashboardBadge() {
            try {
                const res = await fetch('/api/reports/', {
                    headers: { 'Authorization': `Token ${token}` }
                });
                
                if(res.ok) {
                    const data = await res.json();
                    const badge = document.getElementById('dashboardBadge');
                    
                    if(data.length > 0) {
                        badge.innerText = data.length;
                        badge.classList.remove('d-none');
                        badge.classList.add('pulse'); // Tambah efek denyut
                    } else {
                        badge.classList.add('d-none'); // Sembunyikan kalau 0
                        badge.classList.remove('pulse');
                    }
                }
            } catch(e) {
                console.log("Gagal memuat notifikasi, tapi gapapa, silent aja.");
            }
        }
        // ------------------------------------------

        async function loadSpots() {
            try {
                const response = await fetch('/api/spots/', {
                    headers: { 'Authorization': `Token ${token}` }
                });
                const spots = await response.json();
                
                const container = document.getElementById('spotsContainer');
                container.innerHTML = ''; 

                if(spots.length === 0) {
                    container.innerHTML = `
                        <div class="col-12 text-center py-5">
                            <img src="https://cdn-icons-png.flaticon.com/512/7486/7486744.png" width="150" style="opacity:0.5; margin-bottom:20px;">
                            <h5 class="text-muted">Belum ada sensor terpasang</h5>
                        </div>`;
                    return;
                }

                spots.forEach(spot => {
                    const card = `
                        <div class="col-md-6 col-lg-4">
                            <div class="spot-card p-4" onclick="goToDetail(${spot.id})">
                                <i class="fas fa-broadcast-tower card-icon"></i>
                                <div class="d-flex justify-content-between align-items-start mb-3">
                                    <span class="badge status-badge status-aman">
                                        <i class="fas fa-check-circle me-1"></i> Aktif
                                    </span>
                                    <small class="text-muted"><i class="fas fa-microchip"></i> ${spot.sensor_id}</small>
                                </div>
                                <h4 class="fw-bold mb-2 text-dark">${spot.nama_lokasi}</h4>
                                <p class="text-muted small mb-0"><i class="fas fa-map-marker-alt me-2"></i>${spot.alamat || 'Alamat belum diisi'}</p>
                            </div>
                        </div>
                    `;
                    container.innerHTML += card;
                });

            } catch (error) {
                console.error("Error load spots:", error);
            }
        }

        document.getElementById('addSpotForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const payload = {
                sensor_id: document.getElementById('sensorId').value,
                nama_lokasi: document.getElementById('namaLokasi').value,
                alamat: document.getElementById('alamat').value
            };

            try {
                const res = await fetch('/api/spots/', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Token ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    bootstrap.Modal.getInstance(document.getElementById('addSpotModal')).hide();
                    Swal.fire('Berhasil!', 'Sensor baru telah ditambahkan.', 'success');
                    loadSpots();
                    this.reset();
                } else {
                    Swal.fire('Gagal!', 'Sensor ID mungkin sudah terpakai.', 'error');
                }
            } catch (err) {
                Swal.fire('Error', 'Koneksi bermasalah', 'error');
            }
        });

        function goToDetail(id) {
            window.location.href = `/spot/${id}/`;
        }

        function confirmLogout(msg = "Anda yakin ingin keluar?") {
            Swal.fire({
                title: 'Logout?',
                text: msg,
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#4E944F',
                cancelButtonColor: '#d33',
                confirmButtonText: 'Ya, Logout'
            }).then((result) => {
                if (result.isConfirmed) {
                    localStorage.removeItem('user_token');
                    window.location.href = '/';
                }
            });
        }

        initDashboard();
    </script>
</body>
</html>
