<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inbox Laporan - Smart TPA</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --color-primary: #4E944F;
            --color-secondary: #83BD75;
            --color-accent: #B4E197;
            --color-bg: #E9EFC0;
            --color-text: #2c3e50;
            --color-danger: #e74c3c;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--color-bg);
            color: var(--color-text);
            min-height: 100vh;
        }

        /* Navbar */
        .navbar-custom {
            background: white;
            box-shadow: 0 4px 20px rgba(78, 148, 79, 0.1);
            padding: 15px 0;
        }
        .btn-back {
            color: var(--color-primary);
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            transition: all 0.3s;
        }
        .btn-back:hover {
            color: var(--color-secondary);
            transform: translateX(-5px);
        }

        /* Card Container */
        .inbox-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border: none;
            overflow: hidden;
            margin-top: 30px;
        }

        .card-header-custom {
            background: var(--color-primary);
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Badge Counter dengan Animasi */
        .count-badge {
            background: #ff4757; /* Warna merah agar mencolok */
            color: white;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 12px;
            font-size: 0.9rem;
            margin-left: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }

        /* Animasi Berdenyut (Pulse) jika ada Laporan Baru */
        .count-badge.pulse {
            animation: pulse-animation 2s infinite;
        }

        @keyframes pulse-animation {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 10px rgba(255, 71, 87, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 71, 87, 0); }
        }

        /* Table Styling */
        .table-custom { width: 100%; border-collapse: separate; border-spacing: 0; }
        .table-custom thead th {
            background-color: #f8f9fa; color: #6c757d; font-weight: 600;
            text-transform: uppercase; font-size: 0.85rem; padding: 15px 20px;
            border-bottom: 2px solid #e9ecef;
        }
        .table-custom tbody tr { transition: background-color 0.2s; }
        .table-custom tbody tr:hover { background-color: #f1f8e9; }
        .table-custom td {
            padding: 20px; vertical-align: middle; border-bottom: 1px solid #f0f0f0; font-size: 0.95rem;
        }
        .table-custom td:first-child { border-left: 5px solid transparent; }
        .table-custom tr:hover td:first-child { border-left-color: var(--color-primary); }

        /* Elements */
        .user-avatar {
            width: 35px; height: 35px; background: var(--color-accent);
            color: #1e4620; border-radius: 50%; display: flex;
            align-items: center; justify-content: center; font-weight: bold; margin-right: 10px;
        }
        
        .img-thumbnail-custom {
            width: 60px; height: 60px; object-fit: cover; border-radius: 10px;
            cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
            border: 2px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .img-thumbnail-custom:hover {
            transform: scale(1.5); box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            z-index: 10; position: relative;
        }

        .badge-spot {
            background-color: var(--color-accent); color: #1e4620; padding: 6px 15px;
            border-radius: 20px; font-weight: 600; font-size: 0.85rem;
            white-space: nowrap; display: inline-block;
        }

        /* Tombol Hapus Baru */
        .btn-delete {
            background: #ffebee; color: #c62828; border: none; width: 35px; height: 35px;
            border-radius: 8px; transition: all 0.2s; display: flex;
            align-items: center; justify-content: center;
        }
        .btn-delete:hover {
            background: #c62828; color: white; transform: scale(1.1);
            box-shadow: 0 3px 10px rgba(198, 40, 40, 0.3);
        }

        .btn-refresh {
            background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.5);
            color: white; border-radius: 50%; width: 40px; height: 40px;
            display: flex; align-items: center; justify-content: center; transition: all 0.3s;
        }
        .btn-refresh:hover { background: white; color: var(--color-primary); transform: rotate(180deg); }

        /* Pagination */
        .pagination-container {
            padding: 20px 30px; display: flex; justify-content: space-between;
            align-items: center; border-top: 1px solid #e9ecef; background: #fafafa;
        }
        .btn-page {
            border: 1px solid #ddd; background: white; color: #555; padding: 8px 15px;
            border-radius: 8px; font-size: 0.9rem; transition: all 0.2s; cursor: pointer;
        }
        .btn-page:hover:not(:disabled) { background: var(--color-primary); color: white; border-color: var(--color-primary); }
        .btn-page:disabled { background: #f0f0f0; color: #bbb; cursor: not-allowed; }
        .page-info { font-size: 0.9rem; color: #666; font-weight: 500; }

        .empty-state { text-align: center; padding: 60px 20px; }
        .empty-icon { font-size: 4rem; color: var(--color-accent); margin-bottom: 20px; }
    </style>
</head>
<body>

    <nav class="navbar navbar-custom sticky-top">
        <div class="container">
            <a href="/dashboard/" class="btn-back">
                <i class="fas fa-arrow-left me-2"></i> Kembali ke Dashboard
            </a>
            <div class="d-flex align-items-center">
                <span class="badge bg-success bg-opacity-10 text-success border border-success px-3 py-2">
                    <i class="fas fa-user-shield me-2"></i>Akses Pemerintah
                </span>
            </div>
        </div>
    </nav>

    <div class="container pb-5">
        <div class="inbox-card">
            <div class="card-header-custom">
                <div class="d-flex align-items-center">
                    <div>
                        <h4 class="mb-1 fw-bold"><i class="fas fa-inbox me-2"></i>Laporan Masuk</h4>
                        <p class="mb-0 small opacity-75">Pantau keluhan masyarakat terkait TPS</p>
                    </div>
                </div>
                
                <div class="d-flex align-items-center">
                    <span class="me-2 text-white small opacity-75">Total:</span>
                    <span id="totalBadge" class="count-badge me-3">0</span>
                    <button onclick="manualRefresh()" class="btn-refresh" title="Refresh Data">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table-custom">
                    <thead>
                        <tr>
                            <th width="15%">Waktu</th>
                            <th width="15%">Pelapor</th>
                            <th width="20%">Lokasi Spot</th> 
                            <th width="10%">Bukti Foto</th>
                            <th width="30%">Deskripsi Keluhan</th>
                            <th width="10%" class="text-center">Aksi</th> </tr>
                    </thead>
                    <tbody id="reportList">
                        </tbody>
                </table>
            </div>

            <div class="pagination-container" id="paginationControls">
                <div class="page-info">
                    Halaman <span id="currPageDisplay" class="fw-bold text-dark">1</span> dari <span id="totalPageDisplay">1</span>
                </div>
                <div>
                    <button class="btn-page me-2" id="btnPrev" onclick="changePage(-1)"><i class="fas fa-chevron-left me-1"></i> Prev</button>
                    <button class="btn-page" id="btnNext" onclick="changePage(1)">Next <i class="fas fa-chevron-right ms-1"></i></button>
                </div>
            </div>

        </div>
    </div>

    <div class="modal fade" id="photoModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content bg-transparent border-0">
                <div class="modal-body text-center p-0" style="position: relative;">
                    <button type="button" class="btn-close btn-close-white position-absolute top-0 end-0 m-3" data-bs-dismiss="modal"></button>
                    <img id="fullImage" src="" class="img-fluid rounded shadow-lg" style="max-height: 80vh;">
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const token = localStorage.getItem('user_token');
        
        let allReports = [];   
        let currentPage = 1;   
        const itemsPerPage = 5;
        let lastReportCount = 0; // Untuk mendeteksi perubahan data saat auto-refresh

        if(!token) window.location.href = '/';

        // --- 1. Load Reports (Bisa Manual / Auto) ---
        async function loadReports(isAutoRefresh = false) {
            const tbody = document.getElementById('reportList');
            
            // Jika manual, tampilkan loading. Jika auto, biarkan background process
            if(!isAutoRefresh) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center p-5"><div class="spinner-border text-success" role="status"></div></td></tr>`;
                document.getElementById('btnPrev').disabled = true;
                document.getElementById('btnNext').disabled = true;
            }

            try {
                // Cek Role (Hanya sekali diawal utk performa, atau setiap request utk security)
                if (!isAutoRefresh) {
                    const resProfile = await fetch('/api/auth/profile/', { headers: { 'Authorization': `Token ${token}` }});
                    const user = await resProfile.json();
                    if (user.role !== 'Pemerintah') {
                        window.location.href = '/dashboard/';
                        return;
                    }
                }

                // Fetch Data
                const response = await fetch('/api/reports/', {
                    headers: { 'Authorization': `Token ${token}` }
                });
                
                if (!response.ok) throw new Error("Gagal mengambil data");

                const newData = await response.json();

                // --- Update Badge & Animasi ---
                const badge = document.getElementById('totalBadge');
                badge.innerText = newData.length;

                // Jika data bertambah dari sebelumnya, aktifkan animasi pulse
                if (newData.length > lastReportCount && lastReportCount !== 0) {
                    badge.classList.add('pulse');
                } else {
                    badge.classList.remove('pulse');
                }

                // Cek apakah perlu render ulang (jika data berubah atau ini load pertama)
                const isDataChanged = JSON.stringify(newData) !== JSON.stringify(allReports);
                
                if (isDataChanged || !isAutoRefresh) {
                    allReports = newData;
                    lastReportCount = allReports.length;
                    renderTablePage(currentPage);
                }

            } catch (error) {
                console.error("Error:", error);
                if(!isAutoRefresh) tbody.innerHTML = `<tr><td colspan="6" class="text-center text-danger p-4">Gagal memuat data.</td></tr>`;
            }
        }

        // --- 2. Render Tabel ---
        function renderTablePage(page) {
            const tbody = document.getElementById('reportList');
            tbody.innerHTML = ''; 

            if (allReports.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6"><div class="empty-state"><i class="fas fa-check-circle empty-icon"></i><h5>Tidak ada laporan baru</h5><p class="text-muted">Kerja bagus, Pak!</p></div></td></tr>`;
                updatePaginationControls(0);
                return;
            }

            const startIndex = (page - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const dataToShow = allReports.slice(startIndex, endIndex);

            dataToShow.forEach(rpt => {
                const dateObj = new Date(rpt.created_at);
                const dateStr = dateObj.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
                const timeStr = dateObj.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
                const initial = rpt.pelapor ? rpt.pelapor.charAt(0).toUpperCase() : '?';

                // --- LOGIKA PERBAIKAN URL GAMBAR (FIXED) ---
                let finalImageUrl = '';
                if (rpt.image) {
                    const parts = rpt.image.split('/media/');
                    if (parts.length > 1) {
                        // Paksa pakai Origin browser (http://IP:8001) + path gambar
                        finalImageUrl = window.location.origin + '/media/' + parts[1];
                    } else {
                        // Fallback
                        finalImageUrl = rpt.image.replace('https://', 'http://');
                        if (!finalImageUrl.includes(':8001')) {
                            finalImageUrl = finalImageUrl.replace(window.location.hostname, window.location.hostname + ':8001');
                        }
                    }
                } else {
                    finalImageUrl = 'https://via.placeholder.com/150?text=No+Image';
                }
                // ------------------------------------------

                const row = `
                    <tr>
                        <td>
                            <div class="fw-bold text-dark">${dateStr}</div>
                            <div class="small text-muted">${timeStr}</div>
                        </td>
                        <td>
                            <div class="d-flex align-items-center">
                                <div class="user-avatar">${initial}</div>
                                <span class="fw-bold text-secondary">${rpt.pelapor}</span>
                            </div>
                        </td>
                        <td>
                            <span class="badge-spot"><i class="fas fa-map-marker-alt me-1"></i>${rpt.lokasi}</span>
                        </td>
                        <td>
                            <img src="${finalImageUrl}" class="img-thumbnail-custom" 
                                    onclick="showImage('${finalImageUrl}')" 
                                    title="Klik untuk memperbesar"
                                    onerror="this.src='https://via.placeholder.com/150?text=Error'">
                        </td>
                        <td>
                            <div class="text-muted" style="max-width: 250px; line-height: 1.4;">
                                ${rpt.description}
                            </div>
                        </td>
                        <td class="text-center">
                            <button onclick="deleteReport(${rpt.id})" class="btn-delete" title="Hapus Laporan">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });

            updatePaginationControls(Math.ceil(allReports.length / itemsPerPage));
        }

        // --- 3. Fungsi Hapus (Delete) ---
        function deleteReport(id) {
            Swal.fire({
                title: 'Hapus Laporan?',
                text: "Data dan foto akan dihapus permanen!",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#3085d6',
                confirmButtonText: 'Ya, Hapus!',
                cancelButtonText: 'Batal'
            }).then((result) => {
                if (result.isConfirmed) {
                    fetch(`/api/reports/${id}/`, {
                        method: 'DELETE',
                        headers: { 
                            'Authorization': `Token ${token}`,
                            'X-CSRFToken': getCookie('csrftoken') 
                        }
                    })
                    .then(response => {
                        if(response.ok) {
                            Swal.fire('Terhapus!', 'Laporan telah dihapus.', 'success');
                            loadReports(false); // Reload tabel
                        } else {
                            Swal.fire('Gagal!', 'Terjadi kesalahan saat menghapus.', 'error');
                        }
                    })
                    .catch(err => Swal.fire('Error!', 'Koneksi bermasalah.', 'error'));
                }
            })
        }

        // --- Helper: Get CSRF Token ---
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        // --- 4. Pagination & Utility ---
        function updatePaginationControls(totalPages) {
            document.getElementById('currPageDisplay').innerText = currentPage;
            document.getElementById('totalPageDisplay').innerText = totalPages;
            document.getElementById('btnPrev').disabled = (currentPage === 1);
            document.getElementById('btnNext').disabled = (currentPage === totalPages || totalPages === 0);
        }

        function changePage(direction) {
            const totalPages = Math.ceil(allReports.length / itemsPerPage);
            const newPage = currentPage + direction;
            if (newPage > 0 && newPage <= totalPages) {
                currentPage = newPage;
                renderTablePage(currentPage);
            }
        }

        function showImage(url) {
            document.getElementById('fullImage').src = url;
            new bootstrap.Modal(document.getElementById('photoModal')).show();
        }

        function manualRefresh() {
            loadReports(false);
        }

        // --- 5. INITIALIZATION & AUTO REFRESH ---
        loadReports(false); // Load pertama kali
        
        // Auto refresh setiap 5 detik (Background Process)
        setInterval(() => {
            loadReports(true);
        }, 5000);

    </script>
</body>
</html>
